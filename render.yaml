services:
  - type: web
    name: looklook
    runtime: node
    plan: starter
    region: ohio
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Sessions, saved payment methods and the webhook event log survive restarts and deploys
    disk:
      name: looklook-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_DATA_DIR
        value: /var/data
      # PayPal sandbox REST app (never live keys)
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Webhook ID of https://<service>.onrender.com/api/webhooks/paypal in the PayPal app
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Product data, price history and price-drop subscriptions
      - key: CHANNEL3_API_KEY
        sync: false
      # Signing secret (whsec_...) of https://<service>.onrender.com/api/webhooks/channel3 in Channel3
      - key: CHANNEL3_WEBHOOK_SECRET
        sync: false
      # Screenshot reading, reason wording and the Decisions workspace's agents
      - key: ANTHROPIC_API_KEY
        sync: false
      # AG Studio licence for /studio (needed at build time)
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false
      # Allows the labelled "make the next rebuy decline" sandbox test
      - key: DEMO_NEGATIVE_TESTING
        value: "1"
      # Signs the shopper session cookie (a long random string)
      - key: SESSION_SECRET
        sync: false
      # Server-wide limits on model use (shared by every shopper)
      - key: LLM_CALLS_PER_HOUR
        value: "600"
      - key: LLM_MAX_TOKENS
        value: "4096"
      - key: CHECKS_PER_SESSION_PER_HOUR
        value: "30"
      - key: CHECKS_PER_HOUR
        value: "300"
